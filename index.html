<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLog｜個人觀影筆記與影評庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-zinc-900/90 backdrop-blur border-b border-zinc-800 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <button onclick="showHome()" class="font-bold text-lg tracking-tight text-zinc-100 hover:text-amber-400 transition flex items-center gap-2">
        <span>🎬</span>
        <span>CineLog 觀影筆記庫</span>
      </button>
      <div class="flex items-center gap-3">
        <button onclick="toggleAgentsModal()" class="text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 transition">
          📄 AGENTS.md 規範
        </button>
        <button onclick="toggleAddModal()" class="text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-zinc-950 px-3 py-1.5 rounded-lg transition">
          + 模擬 AI 新增影評
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto px-6 py-10 flex-grow w-full">
    
    <!-- 視圖 1：首頁片單總覽 -->
    <div id="home-view" class="space-y-8">
      <section class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h1 class="text-2xl font-bold text-zinc-100">光影紀錄與私人片單</h1>
          <span class="text-xs font-medium bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/30">Spec-Driven Archive</span>
        </div>
        <p class="text-zinc-400 leading-relaxed text-sm">
          收錄看過的電影短評、評分與台詞摘錄。全站遵循 <code class="bg-zinc-800 text-amber-400 px-1.5 py-0.5 rounded">AGENTS.md</code> 結構規範建置，每次新增電影皆採用統一的三段式版型，並自動同步更新首頁索引。
        </p>
      </section>

      <!-- 分類篩選列 -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap gap-2" id="filter-buttons">
          <button onclick="filterMovies('全部')" class="filter-btn active text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500 text-zinc-950">全部</button>
          <button onclick="filterMovies('愛情 / 劇情')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">愛情 / 劇情</button>
          <button onclick="filterMovies('科幻 / 史詩')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">科幻 / 史詩</button>
          <button onclick="filterMovies('傳記 / 歷史')" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">傳記 / 歷史</button>
        </div>
        <span id="movie-count" class="text-xs text-zinc-500">共收錄 3 部電影</span>
      </div>

      <!-- 影評卡片網格 -->
      <div id="movie-grid" class="grid md:grid-cols-2 gap-5"></div>
    </div>

    <!-- 視圖 2：單部電影影評詳細頁 -->
    <div id="detail-view" class="hidden space-y-8">
      <div class="flex items-center justify-between">
        <button onclick="showHome()" class="text-sm font-medium text-amber-400 hover:text-amber-300 transition">
          ← 返回片單總覽
        </button>
        <span id="detail-filename" class="text-xs font-mono text-zinc-500 bg-zinc-900 px-2.5 py-1 rounded border border-zinc-800"></span>
      </div>

      <div id="detail-content" class="space-y-6"></div>
    </div>

  </main>

  <!-- 頁尾 -->
  <footer class="max-w-4xl mx-auto px-6 py-8 text-center text-xs text-zinc-600 border-t border-zinc-900 w-full mt-12">
    © 2026 CineLog Movie Archive. Built with AGENTS.md.
  </footer>

  <!-- 彈窗 1：檢視與複製 AGENTS.md -->
  <div id="agents-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col">
      <div class="p-5 border-b border-zinc-800 flex justify-between items-center">
        <h3 class="font-bold text-zinc-100">📄 AGENTS.md 專案規範文件</h3>
        <button onclick="toggleAgentsModal()" class="text-zinc-400 hover:text-zinc-200 text-sm">✕ 關閉</button>
      </div>
      <div class="p-5 overflow-y-auto text-xs font-mono text-zinc-300 bg-zinc-950/60 leading-relaxed whitespace-pre-wrap" id="agents-text"></div>
      <div class="p-4 border-t border-zinc-800 flex justify-end gap-3">
        <button onclick="copyAgents()" id="copy-btn" class="text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-zinc-950 px-4 py-2 rounded-lg transition">
          複製 AGENTS.md 內容
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 2：模擬 AI 依據規則新增影評 -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-zinc-100">🤖 模擬 AI 依 AGENTS.md 新增影評</h3>
        <button onclick="toggleAddModal()" class="text-zinc-400 hover:text-zinc-200 text-sm">✕</button>
      </div>
      <p class="text-xs text-zinc-400">輸入電影資訊，系統將自動套用三段式標準版型並同步更新首頁卡片。</p>
      <form onsubmit="addNewMovie(event)" class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">中文片名</label>
            <input type="text" id="in-title" required placeholder="例如：腦筋急轉彎2" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 focus:border-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">英文片名（自動轉檔名）</label>
            <input type="text" id="in-en" required placeholder="例如：Inside Out 2" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 focus:border-amber-500 outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">類型</label>
            <select id="in-genre" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none">
              <option>愛情 / 劇情</option>
              <option>科幻 / 史詩</option>
              <option>傳記 / 歷史</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">年份</label>
            <input type="text" id="in-year" required value="2024" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">導演</label>
            <input type="text" id="in-director" required placeholder="凱爾西·曼恩" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">一句話短評（首頁顯示）</label>
          <input type="text" id="in-summary" required placeholder="青春期焦慮具象化的溫柔療癒之作。" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">個人觀影心得</label>
          <textarea id="in-review" rows="3" required placeholder="寫下觀影感受..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">經典台詞</label>
          <input type="text" id="in-quote" required placeholder="也許長大就是快樂變得越來越少。" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 outline-none">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="toggleAddModal()" class="text-xs px-4 py-2 rounded-lg text-zinc-400 hover:bg-zinc-800">取消</button>
          <button type="submit" class="text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-zinc-950 px-4 py-2 rounded-lg">依規範生成頁面</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const agentsContent = `# AGENTS.md - CineLog 個人觀影筆記網站開發規範

## 1. 專案目的 (Project Purpose)
這是一個「CineLog 個人觀影筆記與影評庫」靜態網站，旨在用統一、具電影院質感的暗色劇院版面，記錄看過的電影心得、推薦指數、核心金句與導演資訊，方便日後隨時透過 AI 持續新增影評頁面。

## 2. 目錄結構與檔案命名規範
- /index.html：網站首頁，包含分類篩選與電影影評卡片網格。
- /reviews/<english-movie-title>.html：獨立電影影評頁面（全小寫英文與連字號）。

## 3. 視覺風格與技術規範
- CSS 框架：Tailwind CSS CDN
- 色彩計畫：bg-zinc-950 背景、bg-zinc-900 卡片、amber-500 金獎暖金色強調。

## 4. 新增影評頁面的標準結構
1. 頂部導覽列（含返回首頁按鈕）
2. 電影資訊標頭區（類型標籤、片名、年份導演、五星評分）
3. 三段式內容模組：1. 劇情簡介（無雷）、2. 個人觀影心得、3. 印象最深的一句台詞
4. 統一頁尾`;

    document.getElementById('agents-text').textContent = agentsContent;

    const movies = [
      {
        id: 'past-lives',
        slug: 'past-lives.html',
        title: '之前的我們',
        enTitle: 'Past Lives',
        genre: '愛情 / 劇情',
        year: '2023',
        director: '席琳·宋 (Celine Song)',
        duration: '106 分鐘',
        rating: '★★★★★ (5.0 / 5.0)',
        stars: '★★★★★',
        shortDesc: '橫跨二十四年的重逢，用東方「因緣」概念探討人生選擇與遺憾的溫柔之作。',
        synopsis: '諾拉與海聖是在首爾一起長大的青梅竹馬。十二歲那年，諾拉隨家人移民加拿大，兩人就此失聯。二十年後，兩人在紐約再度重逢，面對各自截然不同的人生軌跡與身分認同，他們在短短一週內重新審視彼此之間的「因緣（In-Yun）」。',
        review: '這部電影最動人的地方在於它的「克制」。沒有灑狗血的爭吵或背叛，所有情緒都藏在眼神停頓與語言切換之間。結尾長達兩分鐘的送別長鏡頭，安靜卻後勁十足。',
        quote: '如果兩個人在今生結婚，那是因為他們前世有過八千層的因緣。',
        quoteBy: 'Nora, Past Lives (2023)',
        hasStaticFile: true
      },
      {
        id: 'dune-part-two',
        slug: 'dune-part-two.html',
        title: '沙丘：第二部',
        enTitle: 'Dune: Part Two',
        genre: '科幻 / 史詩',
        year: '2024',
        director: '丹尼·維勒納夫 (Denis Villeneuve)',
        duration: '166 分鐘',
        rating: '★★★★★ (5.0 / 5.0)',
        stars: '★★★★★',
        shortDesc: '視聽美學的當代巔峰，將英雄神話解構為權力與信仰的冰冷寓言。',
        synopsis: '保羅·亞崔迪在家族遭逢巨變後，與荃妮及弗瑞曼人聯手，踏上向哈肯能家族復仇的征途。面對預言中的救世主身分與無法避免的聖戰幻象，他必須在摯愛與宇宙命運之間做出抉擇。',
        review: '漢斯·季默的配樂與無邊際沙漠構圖完美融合，騎乘沙蟲的段落帶來無與倫比的銀幕震撼。更難得的是導演並未將保羅塑造成傳統英雄，而是冷靜地展現「造神運動」如何一步步吞噬人性。',
        quote: '願你的刀刃碎裂折斷。（May thy knife chip and shatter.）',
        quoteBy: 'Paul Atreides, Dune: Part Two (2024)',
        hasStaticFile: false
      },
      {
        id: 'oppenheimer',
        slug: 'oppenheimer.html',
        title: '奧本海默',
        enTitle: 'Oppenheimer',
        genre: '傳記 / 歷史',
        year: '2023',
        director: '克里斯多福·諾蘭 (Christopher Nolan)',
        duration: '180 分鐘',
        rating: '★★★★☆ (4.5 / 5.0)',
        stars: '★★★★☆',
        shortDesc: '用三小時快節奏剪輯與黑白雙線敘事，剖析原子彈之父的良知與時代重擔。',
        synopsis: '改編自普立茲獎傳記，聚焦美國理論物理學家羅伯特·奧本海默在二戰期間領導「曼哈頓計畫」研發核武的歷程，以及戰後他在冷戰政治氛圍下所面臨的聽證會審判。',
        review: '諾蘭把一場文戲與科學討論拍出了動作片般的窒息張力。彩色與黑白視角的交錯，精準對比了奧本海默的主觀內心掙扎與政客的客觀算計。',
        quote: '現在我成了死神，世界的毀滅者。',
        quoteBy: 'J. Robert Oppenheimer (1945)',
        hasStaticFile: false
      }
    ];

    let currentFilter = '全部';

    function renderMovies() {
      const grid = document.getElementById('movie-grid');
      const filtered = currentFilter === '全部' ? movies : movies.filter(m => m.genre === currentFilter);
      document.getElementById('movie-count').textContent = `共收錄 ${filtered.length} 部電影`;

      grid.innerHTML = filtered.map(m => `
        <div onclick="openMovie('${m.id}')" class="cursor-pointer bg-zinc-900 p-6 rounded-xl border border-zinc-800 hover:border-amber-500/60 transition group flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-md">${m.genre}</span>
              <span class="text-sm text-amber-400 tracking-wider">${m.stars}</span>
            </div>
            <h3 class="text-lg font-bold text-zinc-100 group-hover:text-amber-400 transition mb-1">${m.title} ${m.enTitle}</h3>
            <p class="text-xs text-zinc-500 mb-3">${m.year} · 導演：${m.director}</p>
            <p class="text-sm text-zinc-400 leading-relaxed mb-4">${m.shortDesc}</p>
          </div>
          <div class="pt-3 border-t border-zinc-800/80 flex items-center justify-between text-xs text-zinc-500">
            <span class="font-mono">reviews/${m.slug}</span>
            ${m.hasStaticFile ? `<a href="reviews/${m.slug}" onclick="event.stopPropagation()" class="text-amber-400/80 hover:text-amber-400 underline">獨立分頁 ↗</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterMovies(genre) {
      currentFilter = genre;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.textContent === genre) {
          btn.className = 'filter-btn text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500 text-zinc-950';
        } else {
          btn.className = 'filter-btn text-xs font-medium px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700';
        }
      });
      renderMovies();
    }

    function openMovie(id) {
      const m = movies.find(item => item.id === id);
      if (!m) return;

      document.getElementById('detail-filename').textContent = `reviews/${m.slug}`;
      document.getElementById('detail-content').innerHTML = `
        <div class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <span class="text-xs font-semibold bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-md">${m.genre}</span>
            <span class="text-base text-amber-400 tracking-widest">${m.rating}</span>
          </div>
          <h1 class="text-2xl font-bold text-zinc-100 mb-2">${m.title} ${m.enTitle}</h1>
          <p class="text-sm text-zinc-400">上映年份：${m.year} ｜ 導演：${m.director} ｜ 片長：${m.duration}</p>
        </div>

        <section class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 space-y-3">
          <h2 class="text-lg font-bold text-zinc-100 border-l-4 border-amber-500 pl-3">1. 劇情簡介（無雷）</h2>
          <p class="text-zinc-300 text-sm leading-relaxed">${m.synopsis}</p>
        </section>

        <section class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 space-y-3">
          <h2 class="text-lg font-bold text-zinc-100 border-l-4 border-amber-500 pl-3">2. 個人觀影心得</h2>
          <p class="text-zinc-300 text-sm leading-relaxed">${m.review}</p>
        </section>

        <section class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 space-y-3">
          <h2 class="text-lg font-bold text-zinc-100 border-l-4 border-amber-500 pl-3">3. 印象最深的一句台詞</h2>
          <blockquote class="bg-zinc-950 border-l-2 border-amber-500 p-4 rounded-r-xl text-zinc-200 italic text-sm leading-relaxed">
            「${m.quote}」
            <span class="block text-xs text-zinc-500 not-italic mt-2">—— ${m.quoteBy}</span>
          </blockquote>
        </section>
      `;

      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHome() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('home-view').classList.remove('hidden');
    }

    function toggleAgentsModal() {
      document.getElementById('agents-modal').classList.toggle('hidden');
    }

    function toggleAddModal() {
      document.getElementById('add-modal').classList.toggle('hidden');
    }

    function copyAgents() {
      navigator.clipboard.writeText(agentsContent);
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✓ 已複製到剪貼簿';
      setTimeout(() => { btn.textContent = '複製 AGENTS.md 內容'; }, 2000);
    }

    function addNewMovie(e) {
      e.preventDefault();
      const title = document.getElementById('in-title').value.trim();
      const enTitle = document.getElementById('in-en').value.trim();
      const slugBase = enTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      
      movies.unshift({
        id: slugBase || 'new-movie',
        slug: `${slugBase || 'new-movie'}.html`,
        title: title,
        enTitle: enTitle,
        genre: document.getElementById('in-genre').value,
        year: document.getElementById('in-year').value.trim(),
        director: document.getElementById('in-director').value.trim(),
        duration: '120 分鐘',
        rating: '★★★★★ (5.0 / 5.0)',
        stars: '★★★★★',
        shortDesc: document.getElementById('in-summary').value.trim(),
        synopsis: document.getElementById('in-summary').value.trim(),
        review: document.getElementById('in-review').value.trim(),
        quote: document.getElementById('in-quote').value.trim(),
        quoteBy: `${enTitle} (${document.getElementById('in-year').value.trim()})`,
        hasStaticFile: false
      });

      toggleAddModal();
      e.target.reset();
      filterMovies('全部');
    }

    renderMovies();
  </script>
</body>
</html>
